<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pikachu</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-card">
      <div class="logo">
        <img src="pokemon-logo.png" alt="Logo" width="100px" />
        <i class="ri-menu-line"></i>
      </div>

      <div class="left">
        <h3>POKEMON GEN I</h3>
        <h1>Pikachu</h1>
        <p>
          Pikachu is an Electric-type Pokemon introduced in Generation I.
          Pikachu are small, chubby and increadibly cute mouse-like Pokemon. They
          are almost completely covered by yellow fur.
        </p>

        <div class="num">
          <div class="line"></div>
          <p><b>01/08</b></p>
        </div>

        <img src="pokeball.png" class="pokeball-img" alt="pokeball image">

      </div>

      <img src="./Pikachu/pika1.png" class="pikachu-img" alt="pikachu img" />

      <div class="right">
        <div class="dots-container">
          <span class="active"></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </body>
</html>
