<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Insight & Blogs</title>
</head>
<body>
    <header>
        
        <div class="logo">
            <img src="scalex.png" alt="scale x logo">
            <h4>ScaleX</h4>
        </div>
        
        <nav class="navbar">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Blogs</a>
            <a href="#">Contact Us</a>
        </nav>

        <div class="btn">
            <button>Get Started</button>
        </div>

    </header>

    <main>

        <h1>Insight & Blogs</h1>
        
        <div class="filter-buttons">
             <button class="filter-btn active-btn">All</button>
             <button class="filter-btn">Tech</button>
             <button class="filter-btn">SaaS</button>
             <button class="filter-btn">Marketing</button>
        </div>

        <div class="cards-containers">

            <div class="card1">
                <img src="1.jpg" alt="glass">
                <span class="box">Tech</span>
                <h3>The Ultimate Guide To SaaS Marketing</h3>
                <span class="tech">May 23, 2025</span>
            </div>

            <div class="card2">
                 <img src="2.jpg" alt="chair">
                <span class="box">SaaS</span>
                <h3>5 Key Trends In SaaS Growth For 2025</h3>
                <span class="tech">May 23, 2025</span>
            </div>

            <div class="card3">
                <img src="3.jpg" alt="Cat">
                <span class="box">Marketing</span>
                <h3>How Data-Driven Strategies Are Important</h3>
                <span class="tech">May 23, 2025</span>
            </div>
            
        </div>
    </main>
    
</body>
</html>
